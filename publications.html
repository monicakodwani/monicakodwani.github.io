<!DOCTYPE html>
<html lang="en" data-page="publications">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        var isGitHubPages = window.location.hostname.endsWith("github.io");
        var basePath =
          isGitHubPages && parts.length > 0 && !parts[0].includes(".")
            ? "/" + parts[0]
            : "";
        var base = document.createElement("base");
        base.href = window.location.origin + basePath + "/";
        document.head.appendChild(base);
      })();
    </script>
    <script src="assets/js/theme-init.js"></script>
    <title>Publications | Monica Kodwani</title>
    <meta
      name="description"
      content="Publications by Monica Kodwani on generative AI evaluation, safety perceptions, AI perception metrics, and privacy labels."
    />
    <link rel="icon" href="assets/images/icons/monogram.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body data-page="publications">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="section page-intro">
        <div class="container narrow-flow">
          <p class="section-kicker">Publications</p>
          <h1>Publications</h1>
          <p class="page-lead">
            Peer-reviewed and preprint work on generative AI evaluation,
            safety perceptions, measurement, and privacy transparency.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container publication-stack" data-publication-list>
          <!-- Edit publication entries in content/publications.json. -->
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
